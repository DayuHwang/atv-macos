name: tvOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Xcode 27 (tvOS 27 SDK) lives on its own image: label xcode-27, arm64 only.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pick Xcode 27
        run: |
          X=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode.app 2>/dev/null | head -1)
          [ -n "$X" ] || { ls -d /Applications/Xcode*.app; echo "no Xcode 27 on this image"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version

      - name: JIT servicer tests
        run: python3 jit/test_servicer.py

      - name: Engine for appletvos
        run: zsh tv/build-engine.sh

      - name: Installer stack for appletvos
        run: zsh tv/build-restore.sh

      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd tv/app && xcodegen generate

      - name: Build the tvOS app (unsigned)
        run: |
          rc=0
          xcodebuild -project tv/app/ATVMac.xcodeproj -scheme ATVMac -configuration Release \
            -sdk appletvos -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > build/xcodebuild.log 2>&1 || rc=$?
          grep -E "error:|warning: .*(tv/app|tv/compat)|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log | sort -u | head -80 || true
          exit $rc

      - name: Package the IPA
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-appletvos/ATVMac.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../ATVMac-unsigned.ipa Payload)
          ls -l build/ATVMac-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atv-macos
          path: |
            build/ATVMac-unsigned.ipa
            build/tv/*.a
            build/xcodebuild.log
          if-no-files-found: ignore
