name: Sideloader with tvsign (Windows)

# Builds Dadoum/Sideloader's CLI for Windows with atv-macos's `tvsign` command
# added (pc/sideloader). Upstream is pinned to the commit that was reviewed;
# the build steps are upstream's own (cross-compiled with LDC on Ubuntu).

on:
  push:
    paths:
      - "pc/sideloader/**"
      - ".github/workflows/sideloader-tvos.yml"
  workflow_dispatch:

env:
  SIDELOADER_REF: 631abccace368ececbbd4ed82c35a245834e3af0

jobs:
  cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Sideloader (pinned)
        uses: actions/checkout@v4
        with:
          repository: Dadoum/Sideloader
          ref: ${{ env.SIDELOADER_REF }}
          submodules: recursive

      - name: atv-macos patch
        uses: actions/checkout@v4
        with:
          path: atv
          sparse-checkout: pc/sideloader

      - name: Add tvsign
        run: python3 atv/pc/sideloader/patch.py .

      - name: Update APT repos
        run: sudo apt-get update

      # Upstream's setup action reads the LDC version with `ldc2 --version | head -n 1`,
      # which fails under the runner's pipefail (ldc2 dies of SIGPIPE). Same steps, version pinned.
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.34.0

      - name: LDC target x86_64-windows-msvc
        env:
          LDC_VERSION: 1.34.0
        run: |
          sudo apt-get install -y clang lld 7zip
          mkdir -p "$HOME/.ldc"
          cat > "$HOME/.ldc/ldc2.conf" <<EOF
          "x86_64-.*-windows-msvc":
          {
              switches = [ "-defaultlib=phobos2-ldc,druntime-ldc" ];
              post-switches = [ "-I$HOME/ldc2-$LDC_VERSION-windows-x64/import" ];
              lib-dirs = [ "$HOME/ldc2-$LDC_VERSION-windows-x64/lib" ];
          };
          EOF
          curl -sSLO "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION-windows-x64.7z"
          7z x -bd "./ldc2-$LDC_VERSION-windows-x64.7z" -o"$HOME" > /dev/null
          rm "./ldc2-$LDC_VERSION-windows-x64.7z"

      - name: Write version file
        uses: ./.github/actions/write-version-file
        with:
          version-text: "Sideloader ${{ env.SIDELOADER_REF }} + atv-macos tvsign"

      - name: Build
        run: dub build -b release-debug --compiler=ldc2 --arch x86_64-windows-msvc :cli-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-tvos-exe
          path: bin/sideloader.exe

  package:
    # plist.dll and OpenSSL 3 beside sideloader.exe: what tvsign loads at run time
    # (libimobiledevice is loaded only for USB installs, which tvsign never does).
    needs: cli
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sideloader-tvos-exe
          path: out

      - name: libplist and OpenSSL (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libplist:x64-windows openssl:x64-windows
          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Get-ChildItem $bin -Filter *.dll | Format-Table Name, Length
          $plist = Get-ChildItem $bin -Filter "*plist*.dll" | Where-Object { $_.Name -notmatch "\+\+" } | Select-Object -First 1
          if (-not $plist) { throw "no libplist DLL built" }
          Copy-Item $plist.FullName out\plist.dll
          Copy-Item "$bin\libssl-3-x64.dll", "$bin\libcrypto-3-x64.dll" out\
          # DLLs the copied ones depend on (vcpkg builds zlib etc. as DLLs)
          foreach ($d in Get-ChildItem $bin -Filter *.dll) {
            if (-not (Test-Path "out\$($d.Name)") -and $d.Name -notmatch "plist") { Copy-Item $d.FullName out\ }
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Smoke test
        shell: pwsh
        run: |
          Set-Location out
          .\sideloader.exe version
          .\sideloader.exe tvsign --help

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath sideloader-tvos-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-tvos-win64
          path: sideloader-tvos-win64.zip
